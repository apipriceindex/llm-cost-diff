name: 'llm-cost-diff'
# Marketplace : description limitée à 125 caractères.
description: >-
  Fail CI when your estimated monthly LLM API bill drifts beyond a threshold.
  Prices from apipriceindex.com (CC BY 4.0).
branding:
  icon: 'dollar-sign'
  color: 'orange'

inputs:
  config:
    description: 'Path to llm-costs.json'
    default: 'llm-costs.json'
  lock:
    description: 'Path to llm-costs.lock.json'
    default: 'llm-costs.lock.json'
  index-url:
    description: 'Dataset URL (override for testing)'
    default: 'https://apipriceindex.com/api/all.json'

runs:
  using: 'composite'
  steps:
    - name: Check LLM cost drift
      shell: bash
      env:
        LLM_COST_CONFIG: ${{ inputs.config }}
        LLM_COST_LOCK: ${{ inputs.lock }}
        LLM_COST_INDEX_URL: ${{ inputs.index-url }}
      run: |
        # `|| status=$?` : le shell GitHub tourne avec -e, sans ça une dérive
        # détectée (exit 1) couperait l'étape AVANT l'écriture du résumé.
        status=0
        python3 "${{ github.action_path }}/cost_diff.py" check 2>&1 | tee /tmp/llm-cost-diff.out || status=$?
        {
          echo '### llm-cost-diff'
          echo '```'
          cat /tmp/llm-cost-diff.out
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        exit $status
